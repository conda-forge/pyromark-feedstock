schema_version: 1

context:
  name: pyromark
  version: "0.10.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyromark-${{ version }}.tar.gz
  sha256: 61aed01c2722e5481af42a093f5967618b89fff0882a465f8bf0225ccb3a0808

build:
  number: 1
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyromark = pyromark._cli:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.9.4,<2
    - pip
  run:
    - python
    - typing_extensions >=4.4.0

tests:
  - python:
      imports:
        - pyromark
      pip_check: true
  - script:
      - pyromark --help

about:
  summary: Blazingly fast CommonMark-compliant Markdown pull parser for Python, written in Rust
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/monosans/pyromark
  documentation: https://monosans.github.io/pyromark/

extra:
  recipe-maintainers:
    - thewchan
